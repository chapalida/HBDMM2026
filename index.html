<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HBDMM2026</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap');
  </style>
  <link rel="stylesheet" type="text/css" href="style.css" media="all">
</head>

<body>
  <!-- Screen 1-->>
  <section id="scene1" class="scene active">
    <img class="layer background" src="images/background.png" alt="">
    <img class="layer plant"      src="images/plant.png"      alt="">
    <button class="circle" id="toScene2" aria-label="Zoom in"></button>
  </section>

  <!-- Screen 2-->>
  <section id="scene2" class="scene">
    <img class="layer background" src="images/background2.png" alt="">
    <img class="layer table"      src="images/table.png"      alt="">
    <button class="circle2" id="toScene3" aria-label="Zoom in"></button>
  </section>

  <!-- Screen 3-->>
  <section id="scene3" class="scene">
    <img class="layer background" src="images/background2.png" alt="">
    <img class="layer phone"      src="images/phone.png"      alt="">
  </section>
</body>
